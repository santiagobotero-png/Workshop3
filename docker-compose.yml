
services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: happiness-streaming-broker

    ports:
      - "9092:9092"

    environment:
      # Identificación del nodo
      KAFKA_NODE_ID: 1

      # Broker y Controller en un único nodo (KRaft)
      KAFKA_PROCESS_ROLES: broker,controller

      # Interfaces de comunicación
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      # Configuración del Controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Protocolos de comunicación
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Configuración de almacenamiento y particiones
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3

      # Configuración para un único broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Ajustes operativos
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: happiness-streaming-db
    environment:
      POSTGRES_DB: happiness_streaming
      POSTGRES_USER: happiness_user
      POSTGRES_PASSWORD: 1848
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  kafka_data:
  postgres_data:
